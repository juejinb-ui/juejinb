<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备管理器</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #4f6ef7;
            --primary-hover: #3b54e0;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --success: #27ae60;
            --warning: #f39c12;
            --text: #2c3e50;
            --text-light: #6b7b8d;
            --border: #e0e5ec;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.10);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* 顶部导航 */
        .header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
        }
        .header .logo .icon {
            width: 38px;
            height: 38px;
            background: var(--primary);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.2rem;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* 按钮 */
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            letter-spacing: 0.01em;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(79, 110, 247, 0.35);
        }
        .btn-outline {
            background: #fff;
            color: var(--text);
            border: 1.5px solid var(--border);
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: #f8faff;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
        }
        .btn-danger {
            background: #fff;
            color: var(--danger);
            border: 1.5px solid #fdd;
        }
        .btn-danger:hover {
            background: #fff5f5;
            border-color: var(--danger);
            color: var(--danger-hover);
        }
        .btn-edit {
            background: #fff;
            color: var(--primary);
            border: 1.5px solid #e8ecff;
        }
        .btn-edit:hover {
            background: #f5f7ff;
            border-color: var(--primary);
        }

        /* 主容器 */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 24px 32px;
        }

        /* 统计卡片 */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 24px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all var(--transition);
            cursor: default;
            border: 1px solid transparent;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            border-color: #e8ecff;
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        .stat-icon.all {
            background: #eef2ff;
            color: var(--primary);
        }
        .stat-icon.online {
            background: #e8f8ef;
            color: var(--success);
        }
        .stat-icon.offline {
            background: #fde8e8;
            color: var(--danger);
        }
        .stat-icon.warning {
            background: #fef9e7;
            color: var(--warning);
        }
        .stat-info .stat-num {
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1.2;
        }
        .stat-info .stat-label {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        /* 工具栏 */
        .toolbar {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            transition: all var(--transition);
            background: #fafbfc;
            outline: none;
        }
        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.08);
            background: #fff;
        }
        .search-box .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #aab;
            pointer-events: none;
            font-size: 0.95rem;
        }
        .filter-select {
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            background: #fafbfc;
            cursor: pointer;
            outline: none;
            min-width: 130px;
            transition: all var(--transition);
            color: var(--text);
        }
        .filter-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.08);
            background: #fff;
        }

        /* 设备表格 */
        .table-wrapper {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        thead {
            background: #f8fafc;
        }
        thead th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            color: var(--text-light);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }
        tbody td {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f2f5;
            vertical-align: middle;
        }
        tbody tr {
            transition: background var(--transition);
        }
        tbody tr:hover {
            background: #fafcff;
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        .device-name {
            font-weight: 600;
            color: var(--text);
        }
        .device-type {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
            background: #eef2ff;
            color: #4f6ef7;
        }
        .device-type.server {
            background: #fde8e8;
            color: #c0392b;
        }
        .device-type.router {
            background: #fef9e7;
            color: #b8860b;
        }
        .device-type.switch {
            background: #e8f4fd;
            color: #2471a3;
        }
        .device-type.pc {
            background: #e8f8ef;
            color: #1e7e34;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-badge.online {
            background: #e8f8ef;
            color: #1e7e34;
        }
        .status-badge.offline {
            background: #fde8e8;
            color: #a71d2a;
        }
        .status-badge.maintenance {
            background: #fef9e7;
            color: #b8860b;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.online {
            background: #27ae60;
            box-shadow: 0 0 6px rgba(39, 174, 96, 0.5);
            animation: pulse 2s infinite;
        }
        .status-dot.offline {
            background: #bbb;
        }
        .status-dot.maintenance {
            background: #f39c12;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .actions-cell {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-state .empty-icon {
            font-size: 4rem;
            margin-bottom: 12px;
            opacity: 0.6;
        }
        .empty-state p {
            margin: 4px 0;
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 28px 30px;
            width: 90%;
            max-width: 520px;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal h3 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: var(--text-light);
            letter-spacing: 0.02em;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            transition: all var(--transition);
            outline: none;
            background: #fafbfc;
            color: var(--text);
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.08);
            background: #fff;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #2c3e50;
            color: #fff;
            padding: 14px 22px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 300;
            animation: slideInRight 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        @keyframes slideInRight {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .toast.success {
            background: #27ae60;
        }
        .toast.error {
            background: #e74c3c;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .header {
                padding: 12px 16px;
            }
            .container {
                padding: 16px;
            }
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .stat-card {
                padding: 14px 16px;
                gap: 10px;
            }
            .stat-icon {
                width: 38px;
                height: 38px;
                font-size: 1.1rem;
            }
            .stat-info .stat-num {
                font-size: 1.3rem;
            }
            .toolbar {
                flex-direction: column;
                gap: 8px;
            }
            .search-box {
                min-width: 100%;
            }
            .filter-select {
                width: 100%;
            }
            table {
                font-size: 0.78rem;
            }
            thead th,
            tbody td {
                padding: 10px 8px;
            }
            .btn {
                padding: 8px 12px;
                font-size: 0.78rem;
            }
            .modal {
                padding: 20px;
                width: 95%;
            }
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <header class="header">
        <div class="logo">
            <div class="icon">⚙️</div>
            <span>设备管理器</span>
        </div>
        <div class="header-actions">
            <button class="btn btn-outline btn-sm" onclick="exportData()" title="导出设备数据">📥 导出</button>
            <button class="btn btn-outline btn-sm" onclick="importData()" title="导入设备数据">📤 导入</button>
            <button class="btn btn-primary" onclick="openAddModal()">＋ 添加设备</button>
        </div>
    </header>

    <!-- 主容器 -->
    <div class="container">
        <!-- 统计卡片 -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon all">📋</div>
                <div class="stat-info">
                    <div class="stat-num" id="statTotal">0</div>
                    <div class="stat-label">设备总数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon online">✅</div>
                <div class="stat-info">
                    <div class="stat-num" id="statOnline">0</div>
                    <div class="stat-label">在线设备</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon offline">⛔</div>
                <div class="stat-info">
                    <div class="stat-num" id="statOffline">0</div>
                    <div class="stat-label">离线设备</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon warning">⚠️</div>
                <div class="stat-info">
                    <div class="stat-num" id="statMaintenance">0</div>
                    <div class="stat-label">维护中</div>
                </div>
            </div>
        </div>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索设备名称、IP、位置..." oninput="renderDevices()">
            </div>
            <select class="filter-select" id="statusFilter" onchange="renderDevices()">
                <option value="all">全部状态</option>
                <option value="online">🟢 在线</option>
                <option value="offline">🔴 离线</option>
                <option value="maintenance">⚠️ 维护中</option>
            </select>
            <select class="filter-select" id="typeFilter" onchange="renderDevices()">
                <option value="all">全部类型</option>
                <option value="服务器">服务器</option>
                <option value="路由器">路由器</option>
                <option value="交换机">交换机</option>
                <option value="电脑">电脑</option>
                <option value="打印机">打印机</option>
                <option value="其他">其他</option>
            </select>
            <button class="btn btn-outline btn-sm" onclick="resetFilters()">🔄 重置</button>
        </div>

        <!-- 设备表格 -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>设备名称</th>
                        <th>类型</th>
                        <th>IP 地址</th>
                        <th>位置</th>
                        <th>状态</th>
                        <th>最后更新</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="deviceTableBody">
                    <tr class="empty-state">
                        <td colspan="7">
                            <div class="empty-icon">📭</div>
                            <p><strong>暂无设备</strong></p>
                            <p>点击"添加设备"开始管理您的设备</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 添加/编辑设备模态框 -->
    <div class="modal-overlay" id="deviceModal" style="display:none;">
        <div class="modal">
            <h3 id="modalTitle">＋ 添加设备</h3>
            <form id="deviceForm" onsubmit="handleSubmit(event)">
                <input type="hidden" id="editDeviceId">
                <div class="form-group">
                    <label>设备名称 *</label>
                    <input type="text" id="deviceName" placeholder="例如：核心服务器-01" required>
                </div>
                <div class="form-group">
                    <label>设备类型 *</label>
                    <select id="deviceType" required>
                        <option value="">请选择类型</option>
                        <option value="服务器">服务器</option>
                        <option value="路由器">路由器</option>
                        <option value="交换机">交换机</option>
                        <option value="电脑">电脑</option>
                        <option value="打印机">打印机</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>IP 地址</label>
                    <input type="text" id="deviceIP" placeholder="例如：192.168.1.100">
                </div>
                <div class="form-group">
                    <label>位置</label>
                    <input type="text" id="deviceLocation" placeholder="例如：机房A-3号机柜">
                </div>
                <div class="form-group">
                    <label>状态 *</label>
                    <select id="deviceStatus" required>
                        <option value="online">🟢 在线</option>
                        <option value="offline">🔴 离线</option>
                        <option value="maintenance">⚠️ 维护中</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">保存设备</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 隐藏的文件导入input -->
    <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="handleFileImport(event)">

    <script>
        // ==================== 数据管理 ====================
        const STORAGE_KEY = 'device_manager_devices';

        // 示例设备数据
        const sampleDevices = [{
            id: 'd001',
            name: '核心数据库服务器',
            type: '服务器',
            ip: '192.168.1.10',
            location: '机房A-1号机柜',
            status: 'online',
            updatedAt: '2026-07-10 09:30'
        }, {
            id: 'd002',
            name: 'Web应用服务器',
            type: '服务器',
            ip: '192.168.1.20',
            location: '机房A-2号机柜',
            status: 'online',
            updatedAt: '2026-07-10 08:15'
        }, {
            id: 'd003',
            name: '核心路由器',
            type: '路由器',
            ip: '192.168.1.1',
            location: '网络机房',
            status: 'online',
            updatedAt: '2026-07-10 10:00'
        }, {
            id: 'd004',
            name: '楼层交换机-3F',
            type: '交换机',
            ip: '192.168.3.1',
            location: '3楼弱电间',
            status: 'maintenance',
            updatedAt: '2026-07-09 16:45'
        }, {
            id: 'd005',
            name: '办公电脑-张工',
            type: '电脑',
            ip: '192.168.10.55',
            location: '3楼办公区',
            status: 'offline',
            updatedAt: '2026-07-08 18:30'
        }, {
            id: 'd006',
            name: '财务打印机',
            type: '打印机',
            ip: '192.168.10.80',
            location: '2楼财务室',
            status: 'online',
            updatedAt: '2026-07-10 09:00'
        }, ];

        function getDevices() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    return JSON.parse(stored);
                } catch (e) {
                    return [...sampleDevices];
                }
            }
            // 首次加载使用示例数据
            localStorage.setItem(STORAGE_KEY, JSON.stringify(sampleDevices));
            return [...sampleDevices];
        }

        function saveDevices(devices) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(devices));
        }

        function generateId() {
            return 'd' + Date.now().toString(36) + Math.random().toString(36).substr(2, 4);
        }

        function getNow() {
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            return `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
        }

        // ==================== 渲染 ====================
        function renderDevices() {
            const devices = getDevices();
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const statusFilter = document.getElementById('statusFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;

            let filtered = devices;

            // 搜索过滤
            if (searchTerm) {
                filtered = filtered.filter(d =>
                    d.name.toLowerCase().includes(searchTerm) ||
                    d.ip.toLowerCase().includes(searchTerm) ||
                    d.location.toLowerCase().includes(searchTerm) ||
                    d.type.toLowerCase().includes(searchTerm)
                );
            }

            // 状态过滤
            if (statusFilter !== 'all') {
                filtered = filtered.filter(d => d.status === statusFilter);
            }

            // 类型过滤
            if (typeFilter !== 'all') {
                filtered = filtered.filter(d => d.type === typeFilter);
            }

            // 按更新时间降序排列
            filtered.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));

            const tbody = document.getElementById('deviceTableBody');

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr class="empty-state">
                        <td colspan="7">
                            <div class="empty-icon">📭</div>
                            <p><strong>没有匹配的设备</strong></p>
                            <p>尝试调整搜索条件或添加新设备</p>
                        </td>
                    </tr>`;
            } else {
                tbody.innerHTML = filtered.map(d => {
                    const typeClass = getTypeClass(d.type);
                    const statusText = d.status === 'online' ? '在线' : d.status === 'offline' ? '离线' :
                        '维护中';
                    return `
                    <tr>
                        <td><span class="device-name">${escapeHtml(d.name)}</span></td>
                        <td><span class="device-type ${typeClass}">${escapeHtml(d.type)}</span></td>
                        <td>${escapeHtml(d.ip) || '—'}</td>
                        <td>${escapeHtml(d.location) || '—'}</td>
                        <td>
                            <span class="status-badge ${d.status}">
                                <span class="status-dot ${d.status}"></span>${statusText}
                            </span>
                        </td>
                        <td>${d.updatedAt || '—'}</td>
                        <td>
                            <div class="actions-cell">
                                <button class="btn btn-edit btn-sm" onclick="openEditModal('${d.id}')" title="编辑">✏️ 编辑</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteDevice('${d.id}')" title="删除">🗑️ 删除</button>
                            </div>
                        </td>
                    </tr>`;
                }).join('');
            }

            // 更新统计
            updateStats(devices);
        }

        function updateStats(devices) {
            document.getElementById('statTotal').textContent = devices.length;
            document.getElementById('statOnline').textContent = devices.filter(d => d.status === 'online').length;
            document.getElementById('statOffline').textContent = devices.filter(d => d.status === 'offline').length;
            document.getElementById('statMaintenance').textContent = devices.filter(d => d.status === 'maintenance').length;
        }

        function getTypeClass(type) {
            const map = {
                '服务器': 'server',
                '路由器': 'router',
                '交换机': 'switch',
                '电脑': 'pc',
            };
            return map[type] || '';
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ==================== CRUD 操作 ====================
        function openAddModal() {
            document.getElementById('modalTitle').textContent = '＋ 添加设备';
            document.getElementById('editDeviceId').value = '';
            document.getElementById('deviceName').value = '';
            document.getElementById('deviceType').value = '';
            document.getElementById('deviceIP').value = '';
            document.getElementById('deviceLocation').value = '';
            document.getElementById('deviceStatus').value = 'online';
            document.getElementById('submitBtn').textContent = '保存设备';
            document.getElementById('deviceModal').style.display = 'flex';
            document.getElementById('deviceName').focus();
        }

        function openEditModal(deviceId) {
            const devices = getDevices();
            const device = devices.find(d => d.id === deviceId);
            if (!device) return;

            document.getElementById('modalTitle').textContent = '✏️ 编辑设备';
            document.getElementById('editDeviceId').value = device.id;
            document.getElementById('deviceName').value = device.name;
            document.getElementById('deviceType').value = device.type;
            document.getElementById('deviceIP').value = device.ip || '';
            document.getElementById('deviceLocation').value = device.location || '';
            document.getElementById('deviceStatus').value = device.status;
            document.getElementById('submitBtn').textContent = '更新设备';
            document.getElementById('deviceModal').style.display = 'flex';
            document.getElementById('deviceName').focus();
        }

        function closeModal() {
            document.getElementById('deviceModal').style.display = 'none';
            document.getElementById('deviceForm').reset();
        }

        function handleSubmit(event) {
            event.preventDefault();
            const editId = document.getElementById('editDeviceId').value;
            const devices = getDevices();

            const deviceData = {
                name: document.getElementById('deviceName').value.trim(),
                type: document.getElementById('deviceType').value,
                ip: document.getElementById('deviceIP').value.trim(),
                location: document.getElementById('deviceLocation').value.trim(),
                status: document.getElementById('deviceStatus').value,
                updatedAt: getNow(),
            };

            if (!deviceData.name || !deviceData.type) {
                showToast('请填写设备名称和类型', 'error');
                return;
            }

            if (editId) {
                // 编辑
                const index = devices.findIndex(d => d.id === editId);
                if (index !== -1) {
                    devices[index] = { ...devices[index], ...deviceData };
                    saveDevices(devices);
                    showToast('设备更新成功！', 'success');
                }
            } else {
                // 添加
                const newDevice = { id: generateId(), ...deviceData };
                devices.push(newDevice);
                saveDevices(devices);
                showToast('设备添加成功！', 'success');
            }

            closeModal();
            renderDevices();
        }

        function deleteDevice(deviceId) {
            const devices = getDevices();
            const device = devices.find(d => d.id === deviceId);
            if (!device) return;

            if (confirm(`确定要删除设备「${device.name}」吗？\n此操作不可恢复。`)) {
                const updatedDevices = devices.filter(d => d.id !== deviceId);
                saveDevices(updatedDevices);
                renderDevices();
                showToast('设备已删除', 'success');
            }
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('statusFilter').value = 'all';
            document.getElementById('typeFilter').value = 'all';
            renderDevices();
        }

        // ==================== 导入导出 ====================
        function exportData() {
            const devices = getDevices();
            const dataStr = JSON.stringify(devices, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `设备备份_${getNow().replace(/[: ]/g, '_')}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('数据导出成功！', 'success');
        }

        function importData() {
            document.getElementById('importFileInput').click();
        }

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (!Array.isArray(imported)) {
                        throw new Error('数据格式不正确');
                    }
                    // 基本验证
                    for (const item of imported) {
                        if (!item.name || !item.type || !item.status) {
                            throw new Error('数据缺少必要字段(name, type, status)');
                        }
                    }
                    if (confirm(`即将导入 ${imported.length} 条设备记录，是否覆盖现有数据？\n点击"取消"将合并导入。`)) {
                        saveDevices(imported);
                    } else {
                        const existing = getDevices();
                        const existingIds = new Set(existing.map(d => d.id));
                        const merged = [...existing];
                        for (const item of imported) {
                            if (existingIds.has(item.id)) {
                                // 更新已有设备
                                const idx = merged.findIndex(d => d.id === item.id);
                                merged[idx] = { ...item, updatedAt: getNow() };
                            } else {
                                merged.push({ ...item, id: item.id || generateId(), updatedAt: getNow() });
                            }
                        }
                        saveDevices(merged);
                    }
                    renderDevices();
                    showToast('数据导入成功！', 'success');
                } catch (err) {
                    showToast('导入失败：' + err.message, 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ==================== Toast ====================
        function showToast(message, type = 'success') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: '✅', error: '❌' };
            toast.innerHTML = `${icons[type] || ''} ${message}`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(120%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 2200);
        }

        // ==================== 键盘事件 ====================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const modal = document.getElementById('deviceModal');
                if (modal.style.display === 'flex') {
                    closeModal();
                }
            }
        });

        // 点击模态框外部关闭
        document.getElementById('deviceModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // ==================== 初始化 ====================
        function init() {
            renderDevices();
        }

        init();
        console.log('🚀 设备管理器已就绪');
        console.log('💾 数据存储于浏览器 localStorage');
        console.log('📋 当前设备数：' + getDevices().length);
    </script>
</body>
</html>
