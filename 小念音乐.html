<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小念音乐 · 网易云播放器</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --accent:#5b7cfa;
  --accent2:#8b5cf6;
  --text:#1d2033;
  --sub:#8b90a8;
  --line:rgba(30,40,90,.07);
  --shadow:0 6px 24px rgba(80,100,180,.10);
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',Arial,sans-serif;
  background:#f5f6fb;
  color:var(--text);
  min-height:100vh;
  padding:22px 14px 210px;
  background-image:
    radial-gradient(620px 380px at 0% 0%, rgba(91,124,250,.15), transparent 60%),
    radial-gradient(540px 360px at 100% 4%, rgba(139,92,246,.13), transparent 55%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;margin:0 auto}

/* ── 头部 ── */
.head{margin-bottom:16px;padding:0 4px}
.head h1{font-size:22px;font-weight:700;letter-spacing:-.4px}
.head h1 em{
  font-style:normal;
  background:linear-gradient(120deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand{
  display:inline-flex;align-items:center;gap:7px;
  margin-top:9px;padding:5px 11px;
  font-size:11.5px;color:var(--sub);
  background:#fff;border:1px solid var(--line);
  border-radius:99px;
  box-shadow:0 2px 10px rgba(80,100,180,.06);
}
.brand b{color:#4a5070;font-weight:600}
.brand a{
  color:var(--accent);text-decoration:none;font-weight:600;
  display:inline-flex;align-items:center;gap:4px;
}
.brand a:active{opacity:.6}

/* ── 搜索 ── */
.search{
  display:flex;align-items:center;gap:10px;
  background:#fff;border-radius:99px;
  padding:5px 5px 5px 18px;
  border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--shadow);
  margin-bottom:16px;
}
.search input{
  flex:1;border:0;outline:0;background:transparent;
  font-size:15px;color:var(--text);padding:9px 0;
}
.search input::placeholder{color:#b6bbcd}
.search button{
  width:42px;height:42px;flex:none;
  border:0;border-radius:50%;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-size:15px;
  display:grid;place-items:center;
  box-shadow:0 6px 16px rgba(91,124,250,.35);
  transition:transform .15s;
}
.search button:active{transform:scale(.92)}

/* ── 结果面板 ── */
.panel{
  background:#fff;border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;
}
.panel-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:15px 18px 10px;
  font-size:12.5px;color:var(--sub);
}
.panel-head b{color:var(--text);font-size:14px;font-weight:600}
.list{max-height:46vh;overflow-y:auto;padding:0 8px 10px}
.list::-webkit-scrollbar{width:4px}
.list::-webkit-scrollbar-thumb{background:#e4e7f2;border-radius:4px}

.song{
  display:flex;align-items:center;gap:12px;
  padding:10px;border-radius:13px;cursor:pointer;
  transition:background .18s;
}
.song:hover{background:#f6f7fc}
.song.active{background:rgba(91,124,250,.08)}
.cover{
  width:46px;height:46px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,#7b8ffa,#a78bfa);
  display:grid;place-items:center;color:#fff;font-size:16px;
  position:relative;overflow:hidden;
}
.cover::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.28),transparent 62%);
}
.info{flex:1;min-width:0}
.info h3{
  font-size:14.5px;font-weight:600;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.info p{
  font-size:12px;color:var(--sub);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.acts{display:flex;gap:6px;flex:none}
.acts button{
  width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;
  display:grid;place-items:center;font-size:13px;
  transition:transform .15s,background .18s,color .18s;
}
.acts button:active{transform:scale(.9)}
.acts .play{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;box-shadow:0 4px 12px rgba(91,124,250,.3);
}
.acts .dl{background:#f2f4fa;color:#8b90a8}
.acts .dl:hover{background:#e9ecf7;color:var(--accent)}

.empty{padding:46px 20px;text-align:center;color:#b6bbcd;font-size:13px}
.empty i{display:block;font-size:34px;margin-bottom:12px;color:#dfe3ef}
.loading{padding:46px 20px;text-align:center;color:var(--sub);font-size:13px}
.loading i{display:block;font-size:30px;margin-bottom:12px;color:var(--accent)}

/* ── 播放器 ── */
.player{
  position:fixed;left:50%;bottom:14px;
  width:calc(100% - 28px);max-width:520px;
  transform:translate(-50%,140%);
  transition:transform .45s cubic-bezier(.22,1,.36,1);
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.75);
  border-radius:22px;
  box-shadow:0 14px 42px rgba(60,80,160,.2);
  padding:14px 16px 13px;
  z-index:60;
}
.player.show{transform:translate(-50%,0)}

.p-top{display:flex;align-items:center;gap:12px}
.p-cover{
  width:48px;height:48px;border-radius:14px;flex:none;
  background:linear-gradient(135deg,#7b8ffa,#a78bfa);
  display:grid;place-items:center;color:#fff;font-size:17px;
  transition:box-shadow .3s;
}
.p-cover.on{box-shadow:0 0 0 3px rgba(91,124,250,.18),0 6px 18px rgba(91,124,250,.35)}
.p-meta{flex:1;min-width:0}
.p-meta h3{
  font-size:14.5px;font-weight:600;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.p-meta p{
  font-size:12px;color:var(--sub);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.p-btns{display:flex;align-items:center;gap:2px;flex:none}
.p-btns button{
  border:0;background:transparent;cursor:pointer;
  width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;
  font-size:14px;color:#6b7192;
  transition:color .18s,background .18s,transform .15s;
}
.p-btns button:hover{color:var(--accent);background:rgba(91,124,250,.08)}
.p-btns button:active{transform:scale(.9)}
.p-btns .main{
  width:44px;height:44px;font-size:16px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 6px 16px rgba(91,124,250,.35);
}
.p-btns .main:hover{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}

.p-bar{
  display:flex;align-items:center;gap:10px;margin-top:12px;
  font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;
}
.track{
  flex:1;height:4px;background:#e8ebf4;border-radius:99px;
  cursor:pointer;position:relative;
}
.track .fill{
  height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .1s linear;position:relative;
}
.track .fill::after{
  content:'';position:absolute;right:-4px;top:50%;
  transform:translateY(-50%);
  width:9px;height:9px;border-radius:50%;
  background:#fff;border:2px solid var(--accent);
  opacity:0;transition:opacity .2s;
}
.track:hover .fill::after{opacity:1}

.p-quality{
  display:flex;gap:6px;margin-top:12px;
  overflow-x:auto;scrollbar-width:none;
}
.p-quality::-webkit-scrollbar{display:none}
.p-quality button{
  flex:1;min-width:52px;white-space:nowrap;
  padding:6px 8px;border-radius:99px;
  border:1px solid var(--line);
  background:#fff;color:#8b90a8;
  font-size:11.5px;cursor:pointer;
  transition:all .2s;
}
.p-quality button.on{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border-color:transparent;
  box-shadow:0 4px 12px rgba(91,124,250,.3);
}
.p-quality button:active{transform:scale(.95)}

/* ── 提示 ── */
.toast{
  position:fixed;left:50%;top:18px;
  transform:translate(-50%,-160%);
  background:rgba(28,32,54,.93);
  color:#fff;padding:10px 20px;
  border-radius:99px;font-size:13px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  transition:transform .38s cubic-bezier(.22,1,.36,1);
  z-index:99;max-width:calc(100% - 44px);
  text-align:center;
  backdrop-filter:blur(10px);
}
.toast.show{transform:translate(-50%,0)}

@media (max-width:380px){
  .head h1{font-size:20px}
  .acts button{width:31px;height:31px;font-size:12px}
  .p-quality button{font-size:11px;padding:5px 6px;min-width:46px}
}
</style>
</head>
<body>

<div class="wrap">

  <header class="head">
    <h1><em>小念音乐</em> 播放器</h1>
    <div class="brand">
      <b>小念 @xiaonianTvT</b>
      <span>·</span>
      <a href="https://t.me/xiaoniangongyi" target="_blank" rel="noopener">
        <i class="fab fa-telegram"></i>公益频道
      </a>
    </div>
  </header>

  <div class="search">
    <input type="text" id="q" placeholder="搜索歌曲、歌手或专辑…">
    <button id="go"><i class="fas fa-search"></i></button>
  </div>

  <section class="panel">
    <div class="panel-head">
      <b>搜索结果</b>
      <span id="count">0 首歌曲</span>
    </div>
    <div class="list" id="list">
      <div class="empty">
        <i class="fas fa-music"></i>
        <p>输入关键词，开始你的音乐之旅</p>
      </div>
    </div>
  </section>

</div>

<!-- 播放器 -->
<div class="player" id="player">
  <div class="p-top">
    <div class="p-cover" id="pCover"><i class="fas fa-music"></i></div>
    <div class="p-meta">
      <h3 id="pTitle">未播放</h3>
      <p id="pArtist">—</p>
    </div>
    <div class="p-btns">
      <button id="prev" title="上一首"><i class="fas fa-backward-step"></i></button>
      <button id="toggle" class="main" title="播放/暂停"><i class="fas fa-play" id="pIcon"></i></button>
      <button id="next" title="下一首"><i class="fas fa-forward-step"></i></button>
    </div>
  </div>

  <div class="p-bar">
    <span id="cur">0:00</span>
    <div class="track" id="track"><div class="fill" id="fill"></div></div>
    <span id="dur">0:00</span>
  </div>

  <div class="p-quality" id="quality">
    <button data-q="hires" class="on">高清</button>
    <button data-q="lossless">无损</button>
    <button data-q="exhigh">极高</button>
    <button data-q="higher">较高</button>
    <button data-q="standard">标准</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<audio id="audio" preload="metadata"></audio>

<script>
const $ = id => document.getElementById(id);

const el = {
  q: $('q'), go: $('go'), list: $('list'), count: $('count'),
  player: $('player'), pCover: $('pCover'), pTitle: $('pTitle'), pArtist: $('pArtist'),
  pIcon: $('pIcon'), toggle: $('toggle'), prev: $('prev'), next: $('next'),
  audio: $('audio'), fill: $('fill'), cur: $('cur'), dur: $('dur'),
  track: $('track'), quality: $('quality'), toast: $('toast')
};

const QUALITY_ORDER = ['hires','lossless','exhigh','higher','standard'];
const QUALITY_NAME = {
  hires:'高清音质', lossless:'无损音质', exhigh:'极高音质',
  higher:'较高音质', standard:'标准音质'
};

let songs = [];
let index = -1;
let quality = 'hires';
let playing = false;
let busy = false;
let toastTimer = null;

/* 转义，防止歌曲信息里的特殊字符破坏结构 */
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, ms = 3000){
  el.toast.textContent = msg;
  el.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.toast.classList.remove('show'), ms);
}

const fmt = sec => {
  if (!isFinite(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
};

/* ───────── 搜索 ───────── */
async function search(){
  const kw = el.q.value.trim();
  if (!kw) return toast('请输入搜索关键词');
  if (busy) return toast('正在搜索中，请稍候');

  busy = true;
  el.list.innerHTML = `<div class="loading"><i class="fas fa-spinner fa-spin"></i><p>正在搜索…</p></div>`;
  el.count.textContent = '搜索中…';

  try {
    const res = await fetch(
      `https://node.api.xfabe.com/api/wangyi/search?search=${encodeURIComponent(kw)}&limit=15`
    );
    if (!res.ok) throw new Error('网络异常，搜索失败');

    const data = await res.json();
    if (data.code !== 200 || !data.data?.songs) throw new Error('未找到相关歌曲');

    songs = data.data.songs;
    render();
  } catch (err){
    songs = [];
    el.list.innerHTML = `<div class="empty"><i class="fas fa-triangle-exclamation"></i><p>${esc(err.message)}</p></div>`;
    el.count.textContent = '0 首歌曲';
  } finally {
    busy = false;
  }
}

/* ───────── 渲染列表 ───────── */
function render(){
  if (!songs.length){
    el.list.innerHTML = `<div class="empty"><i class="fas fa-music"></i><p>暂无结果</p></div>`;
    el.count.textContent = '0 首歌曲';
    return;
  }

  el.list.innerHTML = songs.map((s, i) => {
    const ms = s.duration || 0;
    const t = `${Math.floor(ms / 60000)}:${Math.floor(ms % 60000 / 1000).toString().padStart(2, '0')}`;
    return `
      <div class="song${i === index ? ' active' : ''}" data-i="${i}">
        <div class="cover"><i class="fas fa-music"></i></div>
        <div class="info">
          <h3>${esc(s.name)}</h3>
          <p>${esc(s.artistsname)} · ${esc(s.album)} · ${t}</p>
        </div>
        <div class="acts">
          <button class="play" data-play="${i}" title="播放"><i class="fas fa-play"></i></button>
          <button class="dl" data-dl="${i}" title="下载"><i class="fas fa-download"></i></button>
        </div>
      </div>`;
  }).join('');

  el.count.textContent = `${songs.length} 首歌曲`;

  el.list.querySelectorAll('.song').forEach(row => {
    row.addEventListener('click', e => {
      if (e.target.closest('.acts')) return;
      play(+row.dataset.i);
    });
  });
  el.list.querySelectorAll('[data-play]').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); play(+b.dataset.play); }));
  el.list.querySelectorAll('[data-dl]').forEach(b =>
    b.addEventListener('click', e => { e.stopPropagation(); download(+b.dataset.dl); }));
}

/* ───────── 取音频地址（自动降级） ───────── */
async function getUrl(id, q){
  const res = await fetch(`https://api.byfuns.top/1/?id=${id}&level=${q}`);
  if (!res.ok) throw new Error('获取链接失败');
  const url = (await res.text()).trim();
  if (!url.startsWith('http')) throw new Error('无效链接');
  return url;
}

async function resolveUrl(id){
  let i = QUALITY_ORDER.indexOf(quality);
  if (i < 0) i = 0;
  for (; i < QUALITY_ORDER.length; i++){
    const q = QUALITY_ORDER[i];
    try {
      const url = await getUrl(id, q);
      if (q !== quality) toast(`已降级为${QUALITY_NAME[q]}`);
      return url;
    } catch {
      if (i === QUALITY_ORDER.length - 1) throw new Error('所有音质均获取失败');
    }
  }
  throw new Error('无法获取音频');
}

/* ───────── 播放 ───────── */
async function play(i){
  const song = songs[i];
  if (!song) return;

  index = i;
  el.list.querySelectorAll('.song').forEach(r =>
    r.classList.toggle('active', +r.dataset.i === i));

  el.pTitle.textContent = song.name;
  el.pArtist.textContent = `${song.artistsname} · ${song.album}`;
  el.player.classList.add('show');
  el.pCover.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

  try {
    const url = await resolveUrl(song.id);
    el.audio.src = url;
    await el.audio.play();

    playing = true;
    el.pIcon.className = 'fas fa-pause';
    el.pCover.innerHTML = '<i class="fas fa-music"></i>';
    el.pCover.classList.add('on');
  } catch (err){
    playing = false;
    el.pIcon.className = 'fas fa-play';
    el.pCover.innerHTML = '<i class="fas fa-music"></i>';
    el.pCover.classList.remove('on');
    toast(err.message || '播放失败，请换个音质试试');
  }
}

function toggle(){
  if (!el.audio.src) return;
  if (playing){
    el.audio.pause();
    el.pIcon.className = 'fas fa-play';
    el.pCover.classList.remove('on');
  } else {
    el.audio.play().catch(() => toast('播放失败'));
    el.pIcon.className = 'fas fa-pause';
    el.pCover.classList.add('on');
  }
  playing = !playing;
}

function step(d){
  if (!songs.length) return;
  play((index + d + songs.length) % songs.length);
}

/* ───────── 下载 ───────── */
async function download(i){
  const song = songs[i];
  if (!song) return;
  toast('正在准备下载…');

  try {
    const url = await resolveUrl(song.id);
    const ext = (quality === 'hires' || quality === 'lossless') ? 'flac' : 'mp3';
    const a = document.createElement('a');
    a.href = url;
    a.download = `${song.name} - ${song.artistsname}.${ext}`;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast(`下载已开始 · ${QUALITY_NAME[quality]}`);
  } catch (err){
    toast(err.message || '下载失败，请稍后再试');
  }
}

/* ───────── 事件绑定 ───────── */
el.go.addEventListener('click', search);
el.q.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
el.toggle.addEventListener('click', toggle);
el.prev.addEventListener('click', () => step(-1));
el.next.addEventListener('click', () => step(1));

el.audio.addEventListener('timeupdate', () => {
  if (!el.audio.duration) return;
  el.fill.style.width = `${el.audio.currentTime / el.audio.duration * 100}%`;
  el.cur.textContent = fmt(el.audio.currentTime);
});
el.audio.addEventListener('loadedmetadata', () => {
  el.dur.textContent = fmt(el.audio.duration);
});
el.audio.addEventListener('ended', () => step(1));
el.audio.addEventListener('error', () => {
  if (!el.audio.src) return;
  playing = false;
  el.pIcon.className = 'fas fa-play';
  el.pCover.classList.remove('on');
  toast('播放出错，请重试');
});

el.track.addEventListener('click', e => {
  if (!el.audio.duration) return;
  const r = el.track.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  el.audio.currentTime = p * el.audio.duration;
});

el.quality.addEventListener('click', e => {
  const btn = e.target.closest('button[data-q]');
  if (!btn) return;
  el.quality.querySelectorAll('button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  quality = btn.dataset.q;
  if (index !== -1) play(index);
});
</script>

</body>
</html>
